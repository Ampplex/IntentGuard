[project]
name = "intentguard"
version = "0.1.0"
description = "Deterministic authorization gate between an AP2 Intent Mandate and the payment rail"
requires-python = ">=3.11"
# fastapi and boto3 are here rather than in the extras below because the
# deployment target installs from this file and has no way to ask for an extra.
# Nothing else changed: policy/, the benchmark and the tests still import
# neither, and the import-graph tests still prove it. What is lost is a smaller
# install for someone who only wants the engine.
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]
# Optional on purpose: the rule-based extractor runs the demo and the whole
# test suite without a network call or an API key.
llm = ["anthropic>=1.0"]
# Bedrock is an alternative extraction backend. Its Converse API is
# provider-agnostic, so one implementation covers every model it hosts.
bedrock = ["boto3>=1.35"]
# The checkout surface. Optional because the engine, the benchmark and every
# test run without a web server.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intentguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The specification documents are prose, not source. ruff formats fenced python
# inside markdown and rewrote CLAUDE.md's aligned schema comments once already.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
