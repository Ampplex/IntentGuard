[project]
name = "intentguard"
version = "0.1.0"
description = "Deterministic authorization gate between an AP2 Intent Mandate and the payment rail"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intentguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The specification documents are prose, not source. ruff formats fenced python
# inside markdown and rewrote CLAUDE.md's aligned schema comments once already.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
